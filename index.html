<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file:; img-src 'self' blob: data: https: http:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Тихие заметки</title><link rel="stylesheet" href="style.css"></head>
<body><header><strong>◈ Тихие заметки</strong><button id="new">＋ Заметка</button><button id="import">Импорт</button><button id="image">Фото</button><button id="export">Экспорт</button><button id="ai">Для нейросети</button><span class="spacer"></span><button id="theme">Тема</button><label>Текст <select id="font"><option>14</option><option selected>16</option><option>18</option><option>20</option><option>24</option></select></label><button id="help">Помощь</button></header>
<div class="notice">Заметки хранятся только в этом браузере. Очистка его данных может удалить их. Регулярно скачивайте резервную копию.</div>
<main><aside><input id="search" type="search" placeholder="Поиск по названию и тексту" aria-label="Поиск"><div class="row"><select id="folderFilter" aria-label="Папка"></select><button id="newFolder" title="Создать папку">＋ Папка</button></div><div class="row"><select id="filter" aria-label="Фильтр"><option value="all">Все заметки</option><option value="favorite">Избранное</option><option value="trash">Корзина</option></select><select id="sort" aria-label="Сортировка"><option value="date">По дате</option><option value="title">По названию</option></select></div><input id="tagFilter" placeholder="Фильтр по тегу" aria-label="Фильтр по тегу"><nav id="notes"></nav><small id="total"></small></aside>
<section id="workspace"><div class="metadata"><input id="title" aria-label="Название заметки" placeholder="Название заметки"><button id="star" title="Избранное">☆</button><button id="delete">В корзину</button></div><div class="row"><label>Папка <select id="folder" aria-label="Папка заметки"></select></label><label class="grow">Теги <input id="tags" placeholder="через запятую"></label><span id="status" role="status" aria-live="polite"></span></div>
<div class="row modes"><button data-mode="edit">Редактор</button><button data-mode="view">Просмотр</button><button data-mode="split">Редактор + просмотр</button><span id="count"></span></div>
<div id="toolbar"><button data-format="heading">Заголовок</button><button data-format="bold"><b>Жирный</b></button><button data-format="italic"><i>Курсив</i></button><button data-format="list">• Список</button><button data-format="number">1. Список</button><button data-format="check">☑ Задача</button><button data-format="quote">Цитата</button><button data-format="link">Ссылка</button><button data-format="wiki">[[Заметка]]</button><button data-format="code">Код</button><button data-format="block">Блок кода</button><button data-format="table">Таблица</button><button data-format="rule">Разделитель</button></div>
<div id="panels" class="split"><textarea id="editor" aria-label="Текст Markdown" spellcheck="true" placeholder="Начните писать…"></textarea><article id="preview"></article></div><footer><b>Обратные ссылки</b><div id="backlinks"></div></footer></section></main>
<input id="files" type="file" accept=".md,.txt,.zip" multiple hidden><input id="pictures" type="file" accept="image/png,image/jpeg,image/gif" multiple hidden>
<dialog id="dialog"><div id="dialogBody"></div><button id="closeDialog">Закрыть</button></dialog><div id="toast" role="alert"></div>
<script src="vendor/marked.min.js"></script><script src="vendor/purify.min.js"></script><script src="vendor/jszip.min.js"></script><script src="app.js"></script></body></html>
