<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file:; img-src 'self' blob: data: https: http:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Лист — место для мыслей</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><span class="brand-mark" aria-hidden="true">л</span><div><strong>Лист</strong><small>Место для ваших мыслей</small></div></div><span class="spacer"></span><button id="export" class="subtle">Скачать</button><details id="appMenu" class="menu"><summary aria-label="Настройки и другие действия">•••</summary><div class="menu-panel"><span class="menu-heading">Ещё возможности</span><button id="import">Импорт заметок</button><button id="ai">Для нейросети</button><button id="trash">Корзина</button><hr><label class="check-label"><input id="autocorrect" type="checkbox" checked> Исправлять опечатки</label><small>Русские подсказки работают без интернета</small><label class="font-label">Размер текста <select id="font"><option>14</option><option selected>16</option><option>18</option><option>20</option><option>24</option></select></label><button id="theme">Сменить тему</button><button id="help">Как пользоваться</button></div></details></header>
<main><aside><button id="new" class="primary">＋ Новая заметка</button><div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Найти заметку" aria-label="Поиск"></div><button id="allNotes" class="section-label">Заметки <span id="total"></span></button><nav id="notes" aria-label="Ваши заметки"></nav><div class="folder-heading"><span>Папки</span><button id="newFolder" aria-label="Создать папку" title="Создать папку">＋</button></div><nav id="folders" aria-label="Ваши папки"></nav><div class="storage-note"><span class="storage-dot"></span> Только на вашем устройстве<br><button id="backupShortcut">Сохранить резервную копию</button></div></aside>
<section id="workspace"><div class="note-heading"><span id="breadcrumb">Личная заметка</span><details id="noteMenu" class="menu"><summary aria-label="Свойства заметки">•••</summary><div class="menu-panel"><label>Папка <select id="folder" aria-label="Папка заметки"></select></label><label>Теги <input id="tags" placeholder="через запятую"></label><button id="star" title="Избранное">☆ В избранное</button><button id="delete">В корзину</button></div></details></div><input id="title" aria-label="Название заметки" placeholder="Название заметки">
<div class="editor-controls"><div class="modes"><button data-mode="edit">Редактор</button><button data-mode="view">Просмотр</button><button data-mode="split" title="Редактор и просмотр рядом">Рядом</button></div><span class="spacer"></span><button id="image" class="subtle">＋ Фото</button></div>
<div id="toolbar"><button data-format="heading" title="Заголовок">H₂</button><button data-format="bold" title="Жирный"><b>Ж</b></button><button data-format="italic" title="Курсив"><i>К</i></button><span class="toolbar-divider"></span><button data-format="list" title="Список">☷</button><button data-format="check" title="Чек-лист">☑</button><button data-format="wiki" title="Ссылка на заметку">[[ ]]</button><details class="format-more"><summary>Ещё</summary><div><button data-format="number">Нумерованный список</button><button data-format="quote">Цитата</button><button data-format="link">Ссылка</button><button data-format="code">Код</button><button data-format="block">Блок кода</button><button data-format="table">Таблица</button><button data-format="rule">Разделитель</button></div></details></div>
<div id="panels" class="edit"><textarea id="editor" aria-label="Текст Markdown" lang="ru" spellcheck="true" autocorrect="off" autocomplete="off" placeholder="О чём вы думаете? Просто начните писать…"></textarea><article id="preview"></article></div>
<div id="spellbar"><span id="spellStatus">Подсказки слов · без интернета</span><div id="spellSuggestions"></div><button id="undoCorrection" hidden>Отменить исправление</button></div><div class="editor-footer"><span id="status" role="status" aria-live="polite"></span><span id="count"></span></div><details class="backlinks-details"><summary>Связанные заметки</summary><div id="backlinks"></div></details></section><div id="emptyState" hidden><span>✧</span><h2>Место для новой мысли</h2><p>Создайте заметку кнопкой слева.</p></div></main>
<input id="files" type="file" accept=".md,.txt,.zip" multiple hidden><input id="pictures" type="file" accept="image/png,image/jpeg,image/gif" multiple hidden><dialog id="dialog"><div id="dialogBody"></div><button id="closeDialog">Закрыть</button></dialog><div id="toast" role="alert"></div>
<script src="vendor/marked.min.js"></script><script src="vendor/purify.min.js"></script><script src="vendor/jszip.min.js"></script><script src="vendor/ru-words.js"></script><script src="spelling.js"></script><script src="app.js"></script></body></html>
